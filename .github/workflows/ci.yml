name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install dependencies
        run: nci

      - name: Install playground dependencies
        run: pnpm -C playground install

      - name: Prepare
        run: nr dev:prepare

      - name: Lint root
        run: nr lint

      - name: Lint playground (ESLint)
        run: pnpm -C playground lint:es

      - name: Lint playground (Stylelint)
        run: pnpm -C playground lint:style

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install dependencies
        run: nci

      - name: Prepare
        run: nr dev:prepare

      - name: Run tests
        run: nr test